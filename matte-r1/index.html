<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ferdighetstre — Matematikk R1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="../ferdighetstraer/style.css">
  <script src="/js/analytics.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="back-link" href="../ferdighetstraer/">← alle ferdighetstrær</a>
      <h1>Ferdighetstre for Matematikk R1</h1>
      <p class="tagline">Et kart over hvordan ferdigheter og begreper bygger på hverandre — huk av det du mestrer, og kopier en KI-instruks for å trene videre.</p>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label">0 av 0 ferdigheter fullført</span>
      </div>
    </div>
  </header>

  <div id="error-banner"></div>
  <div id="legend"></div>

  <main>
    <div id="graph-scroll">
      <div id="graph-container">
        <div id="column-bands"></div>
        <svg id="edges"></svg>
        <div id="column-headers"></div>
        <div id="nodes-layer"></div>
      </div>
    </div>

    <aside id="detail-panel">
      <div id="detail-panel-inner">
        <p id="detail-empty">Klikk på en node i kartet for å se detaljer.</p>
      </div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <script src="../ferdighetstraer/engine.js"></script>
</body>
</html>
